<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log</title>

<!-- Icons -->
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<!-- manifest.json intentionally not linked: on iOS, once a page declares
     display:standalone via the manifest, the OS prefers the manifest's launch
     URL resolution over the address-bar URL at install time — which in
     practice drops our ?token&api query params even with start_url removed.
     Dropping the manifest link here means iOS falls back to the older,
     more reliable apple-mobile-web-app-* meta tags below, which bookmark
     the exact URL shown in the address bar when you tap Add to Home Screen.
     manifest.json is still in the repo/served, for any Android install flow
     that wants it — Android has generally been reliable about this. -->
<meta name="theme-color" content="#14171C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Log">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171C;
    --surface:#1E2229;
    --surface-2:#262B33;
    --line:#31363F;
    --text:#F5F3EE;
    --text-muted:#8B92A0;
    --text-faint:#565D6B;
    --hot:#FF6B4A;
    --amber:#FFB627;
    --protein:#4ADE80;
    --carbs:#60A5FA;
    --fat:#F472B6;
    --danger:#FF4D6D;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'Manrope',sans-serif; -webkit-font-smoothing:antialiased;}
  body{min-height:100vh; padding-bottom:48px;}
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:0.5px;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a,button{font-family:inherit;}

  .app{max-width:480px; margin:0 auto; padding:20px 18px 0;}

  /* ---------- Header ---------- */
  .header{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px;}
  .app-name{font-family:'Bebas Neue',sans-serif; font-size:13px; color:var(--hot); letter-spacing:2px; margin:0 0 2px; text-transform:uppercase;}
  .header .eyebrow{color:var(--text-faint); font-size:12px; text-transform:uppercase; letter-spacing:1.5px; margin:0 0 2px;}
  .header .date{font-size:32px; margin:0; line-height:1;}
  .gear-btn{width:42px; height:42px; border-radius:50%; background:var(--surface);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    color:var(--text-muted); cursor:pointer; flex-shrink:0;}
  .gear-btn:active{background:var(--surface-2);}
  .gear-btn svg{width:20px; height:20px;}

  /* ---------- Week strip ---------- */
  .week-row{display:flex; align-items:center; gap:8px; margin-bottom:22px;}
  .week-strip{display:flex; flex:1; gap:6px; overflow:hidden;}
  .day-pill{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:10px 0 8px; border-radius:14px; background:var(--surface); border:1px solid transparent;
    cursor:pointer; position:relative;}
  .day-pill .dow{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px;}
  .day-pill .num{font-family:'Bebas Neue',sans-serif; font-size:18px; color:var(--text-muted);}
  .day-pill.today{border-color:var(--amber);}
  .day-pill.today .num{color:var(--amber);}
  .day-pill.selected{background:linear-gradient(155deg, var(--hot), var(--amber));}
  .day-pill.selected .dow,.day-pill.selected .num{color:#14171C;}
  .day-pill.disabled{opacity:0.35; pointer-events:none;}
  .day-pill .dot{width:4px; height:4px; border-radius:50%; background:var(--hot); position:absolute; bottom:4px;}
  .day-pill.selected .dot{background:#14171C;}
  .cal-btn{width:38px; height:38px; border-radius:12px; background:var(--surface);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    color:var(--text-muted); cursor:pointer; flex-shrink:0;}
  .cal-btn svg{width:17px; height:17px;}

  /* ---------- Ring card ---------- */
  .card{background:var(--surface); border-radius:var(--radius); padding:22px 18px; margin-bottom:16px; border:1px solid var(--line);}
  .ring-section{display:flex; align-items:center; gap:18px;}
  .ring-wrap{position:relative; width:150px; height:150px; flex-shrink:0;}
  .ring-wrap svg{width:100%; height:100%; transform:rotate(-90deg);}
  .ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring-center .big{font-family:'Bebas Neue',sans-serif; font-size:38px; line-height:1;}
  .ring-center .unit{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px; margin-top:2px;}
  .ring-center .of{font-size:11px; color:var(--text-muted); margin-top:4px;}
  #ring-fill{transition:stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1);}

  .macro-list{flex:1; display:flex; flex-direction:column; gap:12px;}
  .macro-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
  .macro-head .lbl{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px;}
  .unit-toggle{display:flex; background:var(--surface-2); border-radius:999px; padding:2px; gap:2px;}
  .unit-toggle button{border:none; background:transparent; color:var(--text-faint); font-size:10px;
    padding:4px 9px; border-radius:999px; cursor:pointer; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;}
  .unit-toggle button.active{background:var(--text); color:var(--bg);}

  .macro-row{display:flex; flex-direction:column; gap:4px;}
  .macro-row .top{display:flex; justify-content:space-between; font-size:12px;}
  .macro-row .name{color:var(--text-muted); font-weight:600;}
  .macro-row .val{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text);}
  .bar-track{height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
  .bar-fill{height:100%; border-radius:99px; transition:width 0.6s cubic-bezier(0.4,0,0.2,1);}

  /* ---------- Latest log ---------- */
  .section-title{font-size:12px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1.5px; margin:26px 2px 12px;}
  .log-item{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--line);}
  .log-item:last-child{border-bottom:none;}
  .log-icon{width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .log-icon.in{background:rgba(255,107,74,0.14); color:var(--hot);}
  .log-icon.out{background:rgba(96,165,250,0.14); color:var(--carbs);}
  .log-icon svg{width:18px; height:18px;}
  .log-body{flex:1; min-width:0;}
  .log-name{font-size:13.5px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .log-meta{font-size:11px; color:var(--text-faint); margin-top:2px;}
  .log-cal{font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; flex-shrink:0;}
  .log-cal.out{color:var(--carbs);}
  .empty-state{padding:30px 4px; text-align:center; color:var(--text-faint); font-size:13px;}

  /* ---------- Modal: month picker ---------- */
  .overlay{position:fixed; inset:0; background:rgba(10,11,14,0.72); backdrop-filter:blur(3px);
    display:flex; align-items:flex-end; justify-content:center; z-index:50; opacity:0; pointer-events:none; transition:opacity .18s;}
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{background:var(--surface); width:100%; max-width:480px; border-radius:22px 22px 0 0;
    padding:20px 18px 28px; transform:translateY(16px); transition:transform .2s;}
  .overlay.open .sheet{transform:translateY(0);}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .sheet-head .mtitle{font-family:'Bebas Neue',sans-serif; font-size:22px;}
  .nav-btn{width:32px; height:32px; border-radius:9px; background:var(--surface-2); border:none; color:var(--text-muted); cursor:pointer;}
  .month-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .month-grid .dow{text-align:center; font-size:10px; color:var(--text-faint); padding-bottom:6px; text-transform:uppercase;}
  .month-cell{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:10px;
    font-size:13px; color:var(--text); cursor:pointer; position:relative;}
  .month-cell.blank{cursor:default;}
  .month-cell.disabled{color:var(--text-faint); opacity:0.3; pointer-events:none;}
  .month-cell.avail::after{content:''; width:3px; height:3px; border-radius:50%; background:var(--hot); position:absolute; bottom:5px;}
  .month-cell.today{border:1px solid var(--amber);}
  .month-cell.selected{background:linear-gradient(155deg, var(--hot), var(--amber)); color:#14171C; font-weight:700;}

  /* ---------- Settings view ---------- */
  .settings-view{position:fixed; inset:0; background:var(--bg); z-index:60; transform:translateX(100%); transition:transform .22s ease;}
  .settings-view.open{transform:translateX(0);}
  .settings-inner{max-width:480px; margin:0 auto; padding:20px 18px;}
  .settings-head{display:flex; align-items:center; gap:14px; margin-bottom:26px;}
  .back-btn{width:38px; height:38px; border-radius:11px; background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--text-muted); cursor:pointer;}
  .back-btn svg{width:18px; height:18px;}
  .settings-head h1{font-family:'Bebas Neue',sans-serif; font-size:26px; margin:0;}
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px; margin-bottom:7px;}
  .field input{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:13px 14px; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:16px;}
  .field input:focus{outline:none; border-color:var(--amber);}
  .save-btn{width:100%; padding:15px; border:none; border-radius:14px; margin-top:10px;
    background:linear-gradient(155deg, var(--hot), var(--amber)); color:#14171C; font-weight:800;
    font-size:14px; letter-spacing:0.5px; text-transform:uppercase; cursor:pointer;}
  .save-btn:active{opacity:0.85;}
  .save-msg{text-align:center; font-size:12px; color:var(--protein); margin-top:12px; min-height:16px;}

  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); border:1px solid var(--line); padding:11px 18px; border-radius:12px;
    font-size:12.5px; color:var(--text); opacity:0; transition:all .25s; z-index:80; pointer-events:none;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{display:none;}
  /* Shimmer skeleton */
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  .skel{background:var(--surface-2);border-radius:8px;
    background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 50%,var(--surface-2) 75%);
    background-size:200% 100%;animation:shimmer 1.6s ease-in-out infinite;}
  .skel-ring{width:150px;height:150px;border-radius:50%;flex-shrink:0;}
  .skel-macros{flex:1;display:flex;flex-direction:column;gap:12px;}
  .skel-macro{height:22px;}
  .skel-log{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);}
  .skel-log:last-child{border-bottom:none;}
  .skel-icon{width:38px;height:38px;border-radius:11px;flex-shrink:0;}
  .skel-lines{flex:1;display:flex;flex-direction:column;gap:6px;}
  .skel-line{height:10px;border-radius:5px;}
  .skel-line.w60{width:60%;}
  .skel-line.w40{width:40%;}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

  /* Log form */
  .form-overlay{position:fixed;inset:0;background:rgba(10,11,14,0.72);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .18s;}
  .form-overlay.open{opacity:1;pointer-events:auto;}
  .form-sheet{background:var(--surface);width:100%;max-width:480px;border-radius:22px 22px 0 0;
    padding:20px 18px 28px;transform:translateY(16px);transition:transform .2s;max-height:85vh;overflow-y:auto;}
  .form-overlay.open .form-sheet{transform:translateY(0);}
  .form-sheet h2{font-family:'Bebas Neue',sans-serif;font-size:22px;margin:0 0 16px;}
  .form-field{margin-bottom:14px;}
  .form-field label{display:block;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
  .form-field input,.form-field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;}
  .form-field textarea{font-family:'Manrope',sans-serif;resize:none;height:60px;}
  .form-field input:focus,.form-field textarea:focus{outline:none;border-color:var(--amber);}
  .form-field input:disabled{opacity:0.35;cursor:not-allowed;}
  .type-toggle{display:flex;gap:8px;}
  .type-toggle button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
    color:var(--text-faint);font-weight:700;font-size:13px;cursor:pointer;}
  .type-toggle button.active-in{background:rgba(255,107,74,0.14);border-color:var(--hot);color:var(--hot);}
  .type-toggle button.active-out{background:rgba(96,165,250,0.14);border-color:var(--carbs);color:var(--carbs);}
  .form-actions{display:flex;gap:8px;margin-top:16px;}
  .form-actions .btn-save{flex:1;padding:14px;border:none;border-radius:14px;
    background:linear-gradient(155deg,var(--hot),var(--amber));color:#14171C;font-weight:800;font-size:13px;
    letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;}
  .form-actions .btn-cancel{padding:14px 20px;border:1px solid var(--line);border-radius:14px;
    background:var(--surface-2);color:var(--text-muted);font-weight:700;font-size:13px;cursor:pointer;}
  .form-actions .btn-delete{padding:14px 20px;border:1px solid var(--danger);border-radius:14px;
    background:rgba(255,77,109,0.1);color:var(--danger);font-weight:700;font-size:13px;cursor:pointer;}

  /* Delete confirm */
  .confirm-overlay{position:fixed;inset:0;background:rgba(10,11,14,0.85);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;z-index:55;opacity:0;pointer-events:none;transition:opacity .15s;}
  .confirm-overlay.open{opacity:1;pointer-events:auto;}
  .confirm-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:24px 20px 20px;max-width:300px;width:90%;text-align:center;}
  .confirm-box p{color:var(--text);font-size:14px;margin:0 0 18px;line-height:1.5;}
  .confirm-actions{display:flex;gap:8px;}
  .confirm-actions button{flex:1;padding:12px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;border:none;}
  .confirm-actions .btn-yes{background:var(--danger);color:#fff;}
  .confirm-actions .btn-no{background:var(--surface-2);border:1px solid var(--line);color:var(--text-muted);}

</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div>
      <p class="app-name">CAL TRACKER</p>
      <p class="eyebrow" id="dow-label">Today</p>
      <p class="date display" id="date-label">—</p>
    </div>
    <button class="gear-btn" id="gear-btn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
  </div>

  <div class="week-row">
    <div class="week-strip" id="week-strip"></div>
    <button class="cal-btn" id="cal-btn" aria-label="Pick a date">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    </button>
  </div>

  <div class="card" id="ring-card">
    <div id="ring-card-skeleton" style="display:none">
      <div style="display:flex;align-items:center;gap:18px">
        <div class="skel skel-ring"></div>
        <div class="skel-macros">
          <div class="skel skel-macro"></div>
          <div class="skel skel-macro"></div>
          <div class="skel skel-macro"></div>
        </div>
      </div>
    </div>
    <div class="ring-section" id="ring-section" style="display:none">
      <div class="ring-wrap">
        <svg viewBox="0 0 150 150">
          <defs>
            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FF6B4A"/>
              <stop offset="100%" stop-color="#FFB627"/>
            </linearGradient>
          </defs>
          <circle cx="75" cy="75" r="64" fill="none" stroke="#262B33" stroke-width="12"/>
          <g id="tick-group"></g>
          <circle id="ring-fill" cx="75" cy="75" r="64" fill="none" stroke="url(#ringGrad)"
            stroke-width="12" stroke-linecap="round" stroke-dasharray="402"/>
        </svg>
        <div class="ring-center">
          <div class="big mono" id="cal-current">0</div>
          <div class="unit">kcal</div>
          <div class="of" id="cal-target-label">of 0</div>
        </div>
      </div>

      <div class="macro-list">
        <div class="macro-head">
          <span class="lbl">Nutrients</span>
          <div class="unit-toggle">
            <button id="toggle-g" class="active">g</button>
            <button id="toggle-pct">%</button>
          </div>
        </div>
        <div class="macro-row" data-macro="protein">
          <div class="top"><span class="name" style="color:var(--protein)">Protein</span><span class="val"></span></div>
          <div class="bar-track"><div class="bar-fill" style="background:var(--protein)"></div></div>
        </div>
        <div class="macro-row" data-macro="carbs">
          <div class="top"><span class="name" style="color:var(--carbs)">Carbs</span><span class="val"></span></div>
          <div class="bar-track"><div class="bar-fill" style="background:var(--carbs)"></div></div>
        </div>
        <div class="macro-row" data-macro="fat">
          <div class="top"><span class="name" style="color:var(--fat)">Fat</span><span class="val"></span></div>
          <div class="bar-track"><div class="bar-fill" style="background:var(--fat)"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div style="display:flex;align-items:center;justify-content:space-between;margin:26px 2px 12px;">
    <p class="section-title" style="margin:0">Recent activity</p>
    <button id="add-log-btn" style="width:32px;height:32px;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text-muted);cursor:pointer;font-size:18px;font-weight:700;">+</button>
  </div>
  <div class="card" id="log-list">
    <div class="empty-state">Loading…</div>
  </div>
</div>

<!-- Log form -->
<div class="form-overlay" id="log-form-overlay">
  <div class="form-sheet">
    <h2 id="form-title">Add log</h2>
    <input type="hidden" id="form-row-number">
    <div class="form-field"><label>Item / Meal</label><input type="text" id="form-item" placeholder="e.g. Grilled chicken rice"></div>
    <div class="form-field"><label>Type</label>
      <div class="type-toggle">
        <button id="form-type-in" class="active-in">In</button>
        <button id="form-type-out">Out</button>
      </div>
    </div>
    <div class="form-field"><label>Calories</label><input type="number" id="form-calories" placeholder="0"></div>
    <div style="display:flex;gap:8px">
      <div class="form-field" style="flex:1"><label>Protein (g)</label><input type="number" id="form-protein" placeholder="0"></div>
      <div class="form-field" style="flex:1"><label>Carbs (g)</label><input type="number" id="form-carbs" placeholder="0"></div>
      <div class="form-field" style="flex:1"><label>Fat (g)</label><input type="number" id="form-fat" placeholder="0"></div>
    </div>
    <div class="form-field"><label>Notes</label><textarea id="form-notes" placeholder="Optional"></textarea></div>
    <div class="form-actions">
      <button class="btn-save" id="form-save-btn">Save</button>
      <button class="btn-cancel" id="form-cancel-btn">Cancel</button>
      <button class="btn-delete" id="form-delete-btn" style="display:none">Delete</button>
    </div>
  </div>
</div>

<!-- Delete confirm -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <p>Delete this log entry?</p>
    <div class="confirm-actions">
      <button class="btn-no" id="confirm-no">Cancel</button>
      <button class="btn-yes" id="confirm-yes">Delete</button>
    </div>
  </div>
</div>

<!-- Month picker -->
<div class="overlay" id="month-overlay">
  <div class="sheet">
    <div class="sheet-head">
      <button class="nav-btn" id="month-prev">‹</button>
      <span class="mtitle" id="month-title">—</span>
      <button class="nav-btn" id="month-next">›</button>
    </div>
    <div class="month-grid" id="month-grid"></div>
  </div>
</div>

<!-- Settings -->
<div class="settings-view" id="settings-view">
  <div class="settings-inner">
    <div class="settings-head">
      <button class="back-btn" id="settings-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1>Set target</h1>
    </div>
    <div class="field"><label>Calories (kcal)</label><input type="number" id="in-calories"></div>
    <div class="field"><label>Protein (g)</label><input type="number" id="in-protein"></div>
    <div class="field"><label>Carbs (g)</label><input type="number" id="in-carbs"></div>
    <div class="field"><label>Fat (g)</label><input type="number" id="in-fat"></div>
    <button class="save-btn" id="save-target-btn">Save target</button>
    <div class="save-msg" id="save-msg"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ CONFIG ============ */
// Both values can be set once via URL query params and are then cached
// in localStorage, so you never need to hand-edit this file again —
// even if you create a brand new Apps Script deployment later.
//
// First visit:
//   yoursite.com/?token=YOUR_TOKEN&api=https://script.google.com/macros/s/xxx/exec
// Every visit after that, both params are optional — the cached values
// are used automatically.
const qs = new URLSearchParams(location.search);

const TOKEN = qs.get('token') || localStorage.getItem('cal_token') || '';
if (qs.get('token')) localStorage.setItem('cal_token', qs.get('token'));

const GAS_URL = qs.get('api') || localStorage.getItem('cal_api') || '';
if (qs.get('api')) localStorage.setItem('cal_api', qs.get('api'));

// Shows an unmissable full-screen banner instead of failing silently.
// Called directly (not via a 'DOMContentLoaded' listener) because this
// script runs at the end of <body>, where that event has usually
// already fired.
function showFatalError(message){
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;z-index:200;background:#14171C;color:#F5F3EE;'
    + 'display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;'
    + 'font-family:Manrope,sans-serif;font-size:14px;line-height:1.6;';
  el.innerHTML = '<div style="max-width:340px"><div style="font-family:\'Bebas Neue\',sans-serif;'
    + 'font-size:24px;color:#FF6B4A;margin-bottom:10px;">Setup needed</div>' + message + '</div>';
  document.body.appendChild(el);
}

if (!TOKEN || !GAS_URL) {
  showFatalError(
    'Missing token or API URL. Open this page once with '
    + '<code style="color:#FFB627">?token=YOUR_TOKEN&amp;api=YOUR_EXEC_URL</code> '
    + 'in the address bar — after that it\'s remembered on this device.'
    + '<div style="margin-top:16px; font-size:11px; color:#565D6B; word-break:break-all;">'
    + 'Launched with: ' + location.href + '</div>'
  );
}

/* ============ STATE ============ */
let state = {
  selectedDate: todayStr(),
  today: todayStr(),
  availability: new Set(),
  unit: 'g',            // 'g' | 'pct'
  monthCursor: new Date(),
  dayData: null
};

/* ============ HELPERS ============ */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function pad(n){ return n<10 ? '0'+n : ''+n; }
function parseDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function toKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function mondayOf(d){
  const day = d.getDay(); // 0=Sun..6=Sat
  const diff = (day===0? -6 : 1-day);
  const m = new Date(d); m.setDate(d.getDate()+diff);
  return m;
}
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

async function api(params){
  const url = new URL(GAS_URL);
  url.searchParams.set('token', TOKEN);
  Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));

  let res;
  try{
    res = await fetch(url.toString());
  }catch(networkErr){
    // fetch() itself only throws for network failures or CORS blocks —
    // it does NOT throw for HTTP error statuses (see the res.ok check below).
    throw new Error('NETWORK_OR_CORS: ' + networkErr.message);
  }
  if (!res.ok){
    throw new Error('HTTP_' + res.status);
  }
  const data = await res.json();
  if (data && data.error){
    throw new Error('API: ' + data.error);
  }
  return data;
}

/* ============ INIT ============ */
async function init(){
  if (!TOKEN || !GAS_URL) return; // banner already shown by showFatalError above
  try{
    const avail = await api({ action:'availability' });
    (avail.dates||[]).forEach(d => state.availability.add(d));
  }catch(e){
    console.error('availability fetch failed:', e);
  }
  state.availability.add(state.today); // today always selectable
  renderWeekStrip();
  await loadDay(state.selectedDate);
}

async function loadDay(dateStr){
  state.selectedDate = dateStr;
  renderWeekStrip();
  renderHeader();
  const el = document.getElementById('log-list');
  // B9+B12: show ring-card skeleton, hide real ring
  document.getElementById('ring-card-skeleton').style.display = '';
  document.getElementById('ring-section').style.display = 'none';
  el.innerHTML = '<div style="padding:6px 14px">' +
    '<div class="skel-log"><div class="skel skel-icon"></div><div class="skel-lines"><div class="skel skel-line w60"></div><div class="skel skel-line w40"></div></div><div class="skel" style="width:40px;height:12px;border-radius:6px"></div></div>' +
    '<div class="skel-log"><div class="skel skel-icon"></div><div class="skel-lines"><div class="skel skel-line w60"></div><div class="skel skel-line w40"></div></div><div class="skel" style="width:40px;height:12px;border-radius:6px"></div></div>' +
    '<div class="skel-log"><div class="skel skel-icon"></div><div class="skel-lines"><div class="skel skel-line w60"></div><div class="skel skel-line w40"></div></div><div class="skel" style="width:40px;height:12px;border-radius:6px"></div></div>' +
    '</div>';
  try{
    const data = await api({ action:'data', date: dateStr });
    state.dayData = data;
    // B9: hide skeleton, show real ring
    document.getElementById('ring-card-skeleton').style.display = 'none';
    document.getElementById('ring-section').style.display = '';
    renderRing();
    renderMacros();
    renderLogList();
  }catch(e){
    console.error('day data fetch failed:', e);
    let msg = 'Could not load. ';
    if (String(e.message).startsWith('API: unauthorized')) {
      msg += 'Your token was rejected — double check it matches TOKEN in code.gs.';
    } else if (String(e.message).startsWith('NETWORK_OR_CORS')) {
      msg += 'Request was blocked (often CORS or an offline/expired deployment) — check the browser console for details.';
    } else {
      msg += 'See browser console for details (' + e.message + ').';
    }
    el.innerHTML = '<div class="empty-state">' + msg + '</div>';
    document.getElementById('ring-card-skeleton').style.display = 'none';
    document.getElementById('ring-section').style.display = '';
  }
}

/* ============ HEADER ============ */
function renderHeader(){
  const d = parseDate(state.selectedDate);
  const isToday = state.selectedDate === state.today;
  document.getElementById('dow-label').textContent = isToday ? 'Today' :
    d.toLocaleDateString('en-US',{weekday:'long'});
  document.getElementById('date-label').textContent =
    d.toLocaleDateString('en-US',{month:'long', day:'numeric', year:'numeric'});
}

/* ============ WEEK STRIP ============ */
function renderWeekStrip(){
  const strip = document.getElementById('week-strip');
  strip.innerHTML = '';
  const monday = mondayOf(parseDate(state.selectedDate));
  const dows = ['M','T','W','T','F','S','S'];
  for(let i=0;i<7;i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const key = toKey(d);
    const isToday = key === state.today;
    const isSelected = key === state.selectedDate;
    const hasData = state.availability.has(key);
    const pill = document.createElement('div');
    pill.className = 'day-pill'
      + (isToday? ' today':'') + (isSelected? ' selected':'') + (!hasData? ' disabled':'');
    pill.innerHTML = `<span class="dow">${dows[i]}</span><span class="num">${d.getDate()}</span>`
      + (hasData && !isSelected ? '<span class="dot"></span>' : '');
    if(hasData){
      pill.addEventListener('click', ()=> loadDay(key));
    }
    strip.appendChild(pill);
  }
}

/* ============ RING ============ */
const CIRC = 2*Math.PI*64;
function renderRing(){
  const t = state.dayData.totals;
  const targets = state.dayData.targets;
  const current = Math.round(t.netCalories);
  const target = targets.calories || 1;
  const pct = Math.max(0, Math.min(1, current/target));
  const offset = CIRC - pct*CIRC;
  const ring = document.getElementById('ring-fill');
  ring.style.strokeDasharray = CIRC;
  // B10: animate from 12 o'clock — but only if position actually changed
  const prevOffset = parseFloat(ring.style.strokeDashoffset) || CIRC;
  if(Math.abs(prevOffset - offset) > 0.5){
    ring.style.transition = 'none';
    ring.style.strokeDashoffset = CIRC;
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ ring.style.transition = ''; ring.style.strokeDashoffset = offset; }); });
  } else {
    ring.style.strokeDashoffset = offset;
  }
  // B4: red if over target, blue (out cal color) if under
  if(current > target) ring.style.stroke = 'var(--danger)';
  else if(current > 0) ring.style.stroke = 'var(--carbs)';
  else ring.style.stroke = '#262B33';

  // B5: show % in ring center when unit toggle is pct
  if(state.unit === 'pct'){
    document.getElementById('cal-current').textContent = Math.round((current/target)*100);
    document.getElementById('cal-target-label').textContent = '% of target';
    document.querySelector('.ring-center .unit').textContent = '%';
  } else {
    document.getElementById('cal-current').textContent = current;
    document.getElementById('cal-target-label').textContent = 'of '+Math.round(target);
    document.querySelector('.ring-center .unit').textContent = 'kcal';
  }

  // ticks every 10%
  const tickGroup = document.getElementById('tick-group');
  tickGroup.innerHTML = '';
  for(let i=0;i<20;i++){
    const angle = (i/20)*2*Math.PI;
    const r1=57, r2=64;
    const x1=75+r1*Math.cos(angle), y1=75+r1*Math.sin(angle);
    const x2=75+r2*Math.cos(angle), y2=75+r2*Math.sin(angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1); line.setAttribute('y1',y1);
    line.setAttribute('x2',x2); line.setAttribute('y2',y2);
    line.setAttribute('stroke', '#31363F'); line.setAttribute('stroke-width','1.5');
    tickGroup.appendChild(line);
  }
}

/* ============ MACROS ============ */
function renderMacros(){
  const t = state.dayData.totals;
  const targets = state.dayData.targets;
  ['protein','carbs','fat'].forEach(key=>{
    const row = document.querySelector(`.macro-row[data-macro="${key}"]`);
    const val = t[key] || 0;
    const tgt = targets[key] || 1;
    const pct = Math.max(0, Math.min(100, (val/tgt)*100));
    // B11: animate from 0 to target width
    row.querySelector('.bar-fill').style.width = '0%';
    void row.querySelector('.bar-fill').offsetWidth;
    row.querySelector('.bar-fill').style.width = pct+'%';
    row.querySelector('.val').textContent = state.unit === 'g'
      ? `${Math.round(val)} / ${Math.round(tgt)} g`
      : `${Math.round((val/tgt)*100)}%`;
  });
  syncUnitButtons();
}
function syncUnitButtons(){
  document.getElementById('toggle-g').classList.toggle('active', state.unit==='g');
  document.getElementById('toggle-pct').classList.toggle('active', state.unit==='pct');
}
document.getElementById('toggle-g').addEventListener('click', ()=>{
  state.unit='g'; syncUnitButtons(); renderMacros(); renderRing();
});
document.getElementById('toggle-pct').addEventListener('click', ()=>{
  state.unit='pct'; syncUnitButtons(); renderMacros(); renderRing();
});

/* ============ LOG LIST ============ */
const inIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2v20M6 2a4 4 0 014 4v4a4 4 0 01-4 4M18 2v20M18 8a3 3 0 00-3 3v0a3 3 0 003 3"/></svg>';
const outIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h7l-1 8 11-14h-7l0-6z"/></svg>';

function renderLogList(){
  const el = document.getElementById('log-list');
  const logs = state.dayData.logs;
  // B2: empty state
  if(!logs.length){
    el.innerHTML = '<div class="empty-state" style="padding:28px 4px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:40px;height:40px;margin:0 auto 12px;display:block;color:var(--text-faint)"><path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg>'
      + '<div style="font-size:14px;color:var(--text-muted);margin-bottom:4px">No logs yet today</div>'
      + '<div style="font-size:12px;color:var(--text-faint);margin-bottom:14px">Start tracking by adding your first meal</div>'
      + '<button onclick="openLogForm()" style="padding:10px 20px;border:none;border-radius:12px;background:linear-gradient(155deg,var(--hot),var(--amber));color:#14171C;font-weight:700;font-size:13px;cursor:pointer;">Add your first meal</button>'
      + '</div>';
    return;
  }
  // B7: clickable log items with rowNumber
  const sorted = [...logs].sort((a,b)=> b.time.localeCompare(a.time));
  el.innerHTML = sorted.map(r=>{
    const isOut = r.type === 'Out';
    return `<div class="log-item" data-row="${r.rowNumber||''}" onclick="openLogForm(${r.rowNumber||0})" style="cursor:pointer">
      <div class="log-icon ${isOut?'out':'in'}">${isOut?outIcon:inIcon}</div>
      <div class="log-body">
        <div class="log-name">${escapeHtml(r.item)}</div>
        <div class="log-meta">${r.time}${r.method? ' · '+r.method:''}</div>
      </div>
      <div class="log-cal ${isOut?'out':''}">${isOut?'-':''}${Math.round(r.calories)}</div>
    </div>`;
  }).join('');
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

/* ============ MONTH PICKER ============ */
const calBtn = document.getElementById('cal-btn');
const monthOverlay = document.getElementById('month-overlay');
calBtn.addEventListener('click', ()=>{
  state.monthCursor = parseDate(state.selectedDate);
  renderMonth();
  monthOverlay.classList.add('open');
});
monthOverlay.addEventListener('click', (e)=>{ if(e.target===monthOverlay) monthOverlay.classList.remove('open'); });
document.getElementById('month-prev').addEventListener('click', ()=>{
  state.monthCursor = new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth()-1, 1);
  renderMonth();
});
document.getElementById('month-next').addEventListener('click', ()=>{
  state.monthCursor = new Date(state.monthCursor.getFullYear(), state.monthCursor.getMonth()+1, 1);
  renderMonth();
});

function renderMonth(){
  const cursor = state.monthCursor;
  document.getElementById('month-title').textContent =
    cursor.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  const grid = document.getElementById('month-grid');
  grid.innerHTML = '';
  ['M','T','W','T','F','S','S'].forEach(d=>{
    const el=document.createElement('div'); el.className='dow'; el.textContent=d; grid.appendChild(el);
  });
  const first = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const startOffset = (first.getDay()+6)%7; // Monday-start
  const daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).getDate();

  for(let i=0;i<startOffset;i++){
    const b=document.createElement('div'); b.className='month-cell blank'; grid.appendChild(b);
  }
  for(let day=1; day<=daysInMonth; day++){
    const d = new Date(cursor.getFullYear(), cursor.getMonth(), day);
    const key = toKey(d);
    const hasData = state.availability.has(key);
    const cell = document.createElement('div');
    cell.className = 'month-cell'
      + (hasData? ' avail':' disabled')
      + (key===state.today? ' today':'')
      + (key===state.selectedDate? ' selected':'');
    cell.textContent = day;
    if(hasData){
      cell.addEventListener('click', ()=>{
        monthOverlay.classList.remove('open');
        loadDay(key);
      });
    }
    grid.appendChild(cell);
  }
}

/* ============ SETTINGS ============ */
const settingsView = document.getElementById('settings-view');
document.getElementById('gear-btn').addEventListener('click', async ()=>{
  settingsView.classList.add('open');
  const targets = (state.dayData && state.dayData.targets) || {};
  document.getElementById('in-calories').value = targets.calories || '';
  document.getElementById('in-protein').value = targets.protein || '';
  document.getElementById('in-carbs').value = targets.carbs || '';
  document.getElementById('in-fat').value = targets.fat || '';
});
document.getElementById('settings-back').addEventListener('click', ()=> settingsView.classList.remove('open'));

document.getElementById('save-target-btn').addEventListener('click', async ()=>{
  const btn = document.getElementById('save-target-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try{
    const res = await api({
      action: 'saveTarget',
      calories: document.getElementById('in-calories').value,
      protein: document.getElementById('in-protein').value,
      carbs: document.getElementById('in-carbs').value,
      fat: document.getElementById('in-fat').value
    });
    if(res.success){
      document.getElementById('save-msg').textContent = 'Saved.';
      showToast('Target updated');
      await loadDay(state.selectedDate);
    } else {
      document.getElementById('save-msg').textContent = 'Something went wrong.';
    }
  }catch(e){
    document.getElementById('save-msg').textContent = 'Could not save — check your connection.';
  }
  btn.disabled = false; btn.textContent = 'Save target';
});

/* ============ LOG FORM (B3 + B7) ============ */
let formMode = 'add'; // 'add' or 'edit'
let formEditRow = null;

function openLogForm(rowNumber){
  const overlay = document.getElementById('log-form-overlay');
  document.getElementById('form-row-number').value = rowNumber || '';
  document.getElementById('form-notes').value = '';
  if(rowNumber && state.dayData && state.dayData.logs){
    const log = state.dayData.logs.find(r=> r.rowNumber === rowNumber);
    if(log){
      formMode = 'edit'; formEditRow = rowNumber;
      document.getElementById('form-title').textContent = 'Edit log';
      document.getElementById('form-item').value = log.item || '';
      document.getElementById('form-calories').value = log.calories || '';
      document.getElementById('form-protein').value = log.protein || '';
      document.getElementById('form-carbs').value = log.carbs || '';
      document.getElementById('form-fat').value = log.fat || '';
      document.getElementById('form-notes').value = log.notes || '';
      document.getElementById('form-save-btn').textContent = 'Save changes';
      document.getElementById('form-delete-btn').style.display = '';
      setLogFormType(log.type === 'Out' ? 'out' : 'in');
      overlay.classList.add('open');
      return;
    }
  }
  formMode = 'add'; formEditRow = null;
  document.getElementById('form-title').textContent = 'Add log';
  document.getElementById('form-item').value = '';
  document.getElementById('form-calories').value = '';
  document.getElementById('form-protein').value = '';
  document.getElementById('form-carbs').value = '';
  document.getElementById('form-fat').value = '';
  document.getElementById('form-save-btn').textContent = 'Save';
  document.getElementById('form-delete-btn').style.display = 'none';
  setLogFormType('in');
  overlay.classList.add('open');
}

let logFormType = 'In';
const nutrientIds = ['form-protein','form-carbs','form-fat'];
function setLogFormType(type){
  logFormType = type === 'out' ? 'Out' : 'In';
  const inBtn = document.getElementById('form-type-in');
  const outBtn = document.getElementById('form-type-out');
  inBtn.className = logFormType === 'In' ? 'active-in' : '';
  outBtn.className = logFormType === 'Out' ? 'active-out' : '';
  // OUT: disable nutrient inputs, clear them
  // IN: enable nutrient inputs, auto-calc calories
  nutrientIds.forEach(id=>{
    const el = document.getElementById(id);
    if(logFormType === 'Out'){ el.disabled = true; el.value = ''; }
    else { el.disabled = false; }
  });
  if(logFormType === 'In') calcCalories();
}
function calcCalories(){
  const p = Number(document.getElementById('form-protein').value)||0;
  const c = Number(document.getElementById('form-carbs').value)||0;
  const f = Number(document.getElementById('form-fat').value)||0;
  document.getElementById('form-calories').value = Math.round(p*4 + c*4 + f*9);
}
document.getElementById('form-type-in').addEventListener('click', ()=> setLogFormType('in'));
// Auto-calc calories when nutrient inputs change (IN type only)
nutrientIds.forEach(id=>{
  document.getElementById(id).addEventListener('input', ()=>{
    if(logFormType === 'In') calcCalories();
  });
});
document.getElementById('form-type-out').addEventListener('click', ()=> setLogFormType('out'));

document.getElementById('form-cancel-btn').addEventListener('click', ()=>{
  document.getElementById('log-form-overlay').classList.remove('open');
});

document.getElementById('form-save-btn').addEventListener('click', async ()=>{
  const params = {
    item: document.getElementById('form-item').value.trim(),
    type: logFormType,
    calories: document.getElementById('form-calories').value || '0',
    protein: document.getElementById('form-protein').value || '0',
    carbs: document.getElementById('form-carbs').value || '0',
    fat: document.getElementById('form-fat').value || '0',
    notes: document.getElementById('form-notes').value
  };
  if(!params.item){ showToast('Please enter an item name'); return; }
  const btn = document.getElementById('form-save-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    if(formMode === 'edit' && formEditRow){
      params.rowNumber = formEditRow;
      await api({ action:'updateLog', ...params });
    } else {
      await api({ action:'addLog', ...params });
    }
    document.getElementById('log-form-overlay').classList.remove('open');
    showToast(formMode === 'edit' ? 'Log updated' : 'Log added');
    await loadDay(state.selectedDate);
  } catch(e){
    showToast('Could not save — check connection');
  }
  btn.disabled = false;
  btn.textContent = formMode === 'edit' ? 'Save changes' : 'Save';
});

// B7: delete flow
document.getElementById('form-delete-btn').addEventListener('click', ()=>{
  document.getElementById('confirm-overlay').classList.add('open');
});
document.getElementById('confirm-no').addEventListener('click', ()=>{
  document.getElementById('confirm-overlay').classList.remove('open');
});
document.getElementById('confirm-yes').addEventListener('click', async ()=>{
  document.getElementById('confirm-overlay').classList.remove('open');
  if(!formEditRow) return;
  try {
    await api({ action:'deleteLog', rowNumber: formEditRow });
    document.getElementById('log-form-overlay').classList.remove('open');
    showToast('Log deleted');
    await loadDay(state.selectedDate);
  } catch(e){
    showToast('Could not delete — check connection');
  }
});

// + button opens add form
document.getElementById('add-log-btn').addEventListener('click', ()=> openLogForm());

// Close overlays on backdrop tap
document.getElementById('log-form-overlay').addEventListener('click', e=>{
  if(e.target.id === 'log-form-overlay') e.target.classList.remove('open');
});

/* ============ PULL TO REFRESH (B6) ============ */
let pullStartY = 0, pulling = false;
const appEl = document.querySelector('.app');
appEl.addEventListener('touchstart', e=>{
  if(window.scrollY <= 0) pullStartY = e.touches[0].clientY;
});
appEl.addEventListener('touchmove', e=>{
  if(pullStartY === 0) return;
  const dy = e.touches[0].clientY - pullStartY;
  if(dy > 60 && window.scrollY <= 0){
    pulling = true;
    const el = document.getElementById('log-list');
    if(!el.querySelector('.pull-indicator')){
      const ind = document.createElement('div');
      ind.className = 'pull-indicator';
      ind.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2" style="width:22px;height:22px;animation:spin .8s linear infinite"><path d="M21 12a9 9 0 11-6.22-8.56"/><path d="M21 3v5h-5"/></svg>';
      ind.style.cssText = 'text-align:center;padding:10px 0;';
      el.prepend(ind);
    }
  }
});
appEl.addEventListener('touchend', async ()=>{
  if(pulling){
    pulling = false; pullStartY = 0;
    const ind = document.querySelector('.pull-indicator');
    if(ind) ind.remove();
    showToast('Refreshing…');
    try {
      const avail = await api({ action:'availability' });
      state.availability = new Set(avail.dates || []);
      state.availability.add(state.today);
    } catch(e){}
    await loadDay(state.selectedDate);
  }
  pullStartY = 0;
});

init();
</script>
</body>
</html>
